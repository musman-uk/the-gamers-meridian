name: Build Site

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm install --no-save --no-package-lock sharp

      - name: Sync missing postcard images from Wikimedia Commons
        run: node scripts/sync-images.mjs

      - name: Commit downloaded images and updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync postcard images from Wikimedia Commons"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

      - name: Build site with Vite
        run: npm run build

      - name: Generate code snapshot
        run: node scripts/bundle-code.mjs

      - name: Upload code artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-code-bundle
          path: "*-code.txt"
          retention-days: 7

      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
